name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - ".gitignore"
      - "package-lock.json"
      - "yarn.lock"
permissions:
  contents: read
  pull-requests: write
jobs:
  ai-review:
    name: Claude AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- ':(exclude)*.lock' ':(exclude)dist/**' | head -c 24000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Get changed files
        id: files
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | head -30)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Claude AI Review
        id: review
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DIFF: ${{ steps.diff.outputs.diff }}
          FILES: ${{ steps.files.outputs.files }}
        with:
          script: |
            const https = require('https');
            const prompt = `You are a senior engineer doing a code review.
## PR: ${process.env.PR_TITLE} by ${process.env.PR_AUTHOR}
## Files changed:\n${process.env.FILES}
## Diff:\n\`\`\`diff\n${process.env.DIFF}\n\`\`\`
Review: 🐛 Bugs | 🔒 Security (OWASP) | ⚡ Performance | 🏗️ Architecture | ✅ Tests | 📖 Quality | 📋 Risk: LOW/MEDIUM/HIGH
Summary in Thai, technical details in English. Cite file:line.`;
            const body = JSON.stringify({ model:'claude-opus-4-6', max_tokens:4096, messages:[{role:'user',content:prompt}] });
            const r = await new Promise((res,rej)=>{
              const req = https.request({
                hostname:'api.anthropic.com', path:'/v1/messages', method:'POST',
                headers:{'Content-Type':'application/json','x-api-key':process.env.ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','Content-Length':Buffer.byteLength(body)}
              }, resp=>{ let d=''; resp.on('data',c=>d+=c); resp.on('end',()=>res(JSON.parse(d))); });
              req.on('error',rej); req.write(body); req.end();
            });
            const text = r.content?.[0]?.text || 'AI review unavailable.';
            core.setOutput('text', text);
      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const text = `${{ steps.review.outputs.text }}`;
            const url = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `## 🤖 AI Code Review — Claude Opus\n\n${text}\n\n---\n_[View run](${url})_`;
            const list = await github.rest.issues.listComments({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number});
            const prev = list.data.find(c=>c.user.login==='github-actions[bot]'&&c.body.includes('🤖 AI Code Review'));
            if(prev) await github.rest.issues.updateComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:prev.id,body});
            else await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
